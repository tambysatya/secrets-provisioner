[project]
name = "secrets-provisioner"
version = "0.1.0"
description = "Simple asset provisionner for NAPS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "hypercorn>=0.18.0",
]


[tool.uv]
package=true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
secrets-provisioner = "secrets_provisioner.main:main"

